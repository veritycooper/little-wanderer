name: Publish Little Wanderer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser code syntax
        run: |
          node --check app.js
          node --check pixel-world.js
      - name: Test Cloudflare Worker brain
        run: |
          node --check cloudflare/src/index.js
          node --test cloudflare/tests/worker.test.mjs
      - name: Check Python backend syntax
        run: |
          python -m py_compile backend/main.py backend/brain.py
      - name: Run brain unit and API tests
        run: |
          python -m pip install -r backend/requirements.txt "httpx>=0.27,<1"
          python -m unittest discover -s backend/tests -v
      - name: Validate site files
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
